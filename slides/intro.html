r assigned reading with you, and you are regularly contributing to the class discussion. 90+ indicates exceeding expectations. Above 90 is reserved for participation that is regularly elevating the classroom discussion. This does not mean that you are always talking or dominating the discussion. But it means that, in addition to meeting expectations, your regular contribution to the class discussion habitually shows evidence of purposeful preparation of the assigned course material and reflection on previous course lectures/discussions.\")),mdx(Slide,{mdxType:\"Slide\"},mdx(\"p\",null,\"Reading Quizzes/Responses (5%): Approximately once a week we will have reading quizzes and/or responses. These are low-stakes quizzes or in-class writing responses designed to motivate you too keep up with the reading and stay engaged with the course. There will be 8-12 of these quizzes throughout the semester. Because I know that everyone has busy weeks or has to miss a class, \",mdx(\"strong\",{parentName:\"p\"},\"I will drop your lowest two quizzes. (Note: Quizzes cannot be made up, but that's why I drop your lowest two quizzes. If you have to miss a class in which a quiz was given, don't worry; that will just be one of your dropped quizzes.)\"))),mdx(Slide,{mdxType:\"Slide\"},mdx(\"h2\",null,\"Philosophy Reading Tips\"),mdx(\"ul\",null,mdx(\"li\",{parentName:\"ul\"},\"Get into a focused space.\"),mdx(\"li\",{parentName:\"ul\"},\"Reserve space for reading notes; a reading journal of sorts.\"),mdx(\"li\",{parentName:\"ul\"},\"Review the reading questions.\"),mdx(\"li\",{parentName:\"ul\"},\"Sit up when you read.\"),mdx(\"li\",{parentName:\"ul\"},\"Always read with a pencil.\"),mdx(\"li\",{parentName:\"ul\"},\"Annotate the text.\"),mdx(\"li\",{parentName:\"ul\"},\"Write summary or connecting comments in your reading journal (and/or jot dot quick responses to reading questions) with page numbers.\"),mdx(\"li\",{parentName:\"ul\"},\"Don't read all at once. Take breaks. After about 45
